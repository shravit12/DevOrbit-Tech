name: Auto News Fetch

on:
  schedule:
    # Har 8 ghante me chalega
    - cron: "0 */8 * * *"
  workflow_dispatch: # GitHub Actions tab se manual run button ke liye

permissions:
  contents: write # Yeh zaroori hai taaki bot JSON files ko wapas repo me commit kar sake

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install rss-parser

      - name: Run news fetch script
        run: node src/app/api/news_fetch.js

      - name: Commit and Push Updated JSON Files
        run: |
          git config --global user.name "DevOrbit News Bot"
          git config --global user.email "bot@devorbittech.in"
          
          # Dono JSON files ko add karein
          git add src/data/news.json src/data/final-data.json
          
          # Agar naye news aaye honge tabhi commit karke push karega
          git diff --staged --quiet || (git commit -m "chore: auto-update latest news [skip ci]" && git push)
